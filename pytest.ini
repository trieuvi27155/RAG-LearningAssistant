[pytest]
testpaths = tests
# Đa số test dùng vector/điểm dựng tay nên chạy trong vài giây. Một số ít buộc phải nạp
# model thật (embedding ~1.1GB, reranker ~2.2GB) vì thứ chúng kiểm chính là hành vi của
# model - không mock được. Đánh dấu "slow" để chạy nhanh khi đang sửa code:
#     pytest -m "not slow"     -> bỏ qua test nạp model
#     pytest                   -> chạy tất cả (dùng trước khi chốt thay đổi)
markers =
    slow: test phải nạp model thật, chạy chậm
